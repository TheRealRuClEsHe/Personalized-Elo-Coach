name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.11 matches the deployment target pinned in nixpacks.toml. mgz-fast
      # behaves differently across Python versions and platforms (ISSUE-008),
      # so testing anything else would not tell us about production.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: Run tests
        run: pytest

      # Model-quality checks over the full training set. Separated because a
      # failure here means the model regressed, not that the code broke.
      - name: Run model-quality checks
        run: pytest -m slow
